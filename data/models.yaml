# Scenario service model definitions (service-owned SSoT per ADR-014/ADR-015).
#
# scripts/generate_types.py reads this file and generates wire types into
#   packages/api-scenario/   (Go module, package apiscenario)

files:
  - name: scenario
    target: both
    pkg: apiscenario
    imports:
      - time
    types:
      - name: ScenarioEpisode
        comment: "ScenarioEpisode represents a story episode definition."
        fields:
          - {name: EpisodeID, type: string, json: "episode_id", db: "episode_id"}
          - {name: Faction, type: "*string", json: "faction", db: "faction"}
          - {name: EpisodeNumber, type: int64, json: "episode_number", db: "episode_number"}
          - {name: TitleJa, type: string, json: "title_ja", db: "title_ja"}
          - {name: TitleEn, type: string, json: "title_en", db: "title_en"}
          - {name: RequiredLevel, type: int64, json: "required_level", db: "required_level"}
          - {name: RequiredFactions, type: "[]string", json: "required_factions", db: "required_factions"}
          - {name: RequiredEpisodes, type: "[]string", json: "required_episodes", db: "required_episodes"}
          - {name: ScriptPath, type: string, json: "-", db: "script_path"}
          - {name: ThumbnailPath, type: "*string", json: "-", db: "thumbnail_path"}
          - {name: SortOrder, type: int64, json: "sort_order", db: "sort_order"}
          - {name: IsActive, type: bool, json: "-", db: "is_active"}
          - {name: CreatedAt, type: time.Time, json: "-", db: "created_at"}

      - name: StoryUnlockContext
        comment: "StoryUnlockContext holds pre-fetched data needed for unlock checks."
        fields:
          - {name: PlayerLevel, type: int64}
          - {name: OwnedFactions, type: "map[string]bool"}
          - {name: CompletedEpisodes, type: "map[string]bool"}

      - name: LockReason
        comment: "LockReason describes a single unmet unlock condition."
        fields:
          - {name: Type, type: string, json: "type"}
          - {name: Required, type: "interface{}", json: "required"}
          - {name: Current, type: "interface{}", json: "current,omitempty"}

      - name: EpisodeWithStatus
        comment: "EpisodeWithStatus is the API response element for a single episode with unlock state."
        fields:
          - {name: EpisodeID, type: string, json: "episode_id"}
          - {name: Faction, type: "*string", json: "faction"}
          - {name: EpisodeNumber, type: int64, json: "episode_number"}
          - {name: Title, type: string, json: "title"}
          - {name: ThumbnailURL, type: "*string", json: "thumbnail_url"}
          - {name: IsUnlocked, type: bool, json: "is_unlocked"}
          - {name: IsCompleted, type: bool, json: "is_completed"}
          - {name: LockReasons, type: "[]LockReason", json: "lock_reasons"}

      - name: ScenarioScriptResponse
        fields:
          - {name: EpisodeID, type: string, json: "episode_id"}
          - {name: Script, type: string, json: "script"}

      - name: ScenarioCompleteResponse
        fields:
          - {name: Message, type: string, json: "message"}
          - {name: EpisodeID, type: string, json: "episode_id"}

      - name: OnboardingScriptResponse
        fields:
          - {name: Script, type: string, json: "script"}

      - name: OnboardingCompleteResponse
        comment: "OnboardingCompleteResponse is returned by POST /internal/v1/players/:playerId/onboarding/complete. The complete request body is empty; the initial faction is captured by the prior POST /onboarding/faction step."
        fields:
          - {name: Message, type: string, json: "message"}
          - {name: PlayerID, type: string, json: "player_id"}

      - name: OnboardingNameRequest
        comment: "OnboardingNameRequest is the body for the onboarding name input step. Scenario delegates validation to account via POST /onboarding/name/validate, then publishes onboarding-name-set on success."
        fields:
          - {name: Name, type: string, json: "name"}

      - name: OnboardingFactionRequest
        comment: "OnboardingFactionRequest is the body for the onboarding faction selection step. Scenario validates against SelectableFactions internally, then publishes onboarding-faction-set on success."
        fields:
          - {name: InitialFactionID, type: string, json: "initial_faction_id"}
