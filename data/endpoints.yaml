# ─── Endpoint groups (drives docs/API_REFERENCE.md generation) ───
endpoint_groups:
  - name: ヘルスチェック
    endpoints:
      - method: GET
        path: /health
        summary: サービス死活監視
        auth: なし（ClusterIP 内部のみ）
        response_type: null
        response_example: '{"status": "ok"}'

  - name: シナリオ (internal REST — gateway → scenario)
    description: >
      gateway が ClusterIP 経由で呼び出す内部 API。
      認証は gateway 側 Firebase Auth → X-Player-Id ヘッダ。
    endpoints:
      - method: GET
        path: /internal/v1/players/:playerId/scenarios
        summary: プレイヤーに表示するエピソード一覧（ロック状態・進捗付き）
        auth: ClusterIP（gateway 経由）
        query_params:
          - {name: lang, type: string, default: "ja", description: "表示言語 (ja / en)"}
        response_type: EpisodeWithStatus
        response_wrapper: '{"episodes": [...]}'

      - method: GET
        path: /internal/v1/players/:playerId/scenarios/:episodeId/script
        summary: エピソードのスクリプト本文を取得（GCS からロード）
        auth: ClusterIP（gateway 経由）
        query_params:
          - {name: lang, type: string, default: "ja", description: "スクリプト言語 (ja / en)"}
        response_type: ScenarioScriptResponse
        response_example: '{"episode_id": "ep_001", "script": "..."}'
        errors:
          - {status: 403, reason: "エピソードがロック中"}
          - {status: 404, reason: "エピソードが存在しない / スクリプトが見つからない"}
          - {status: 500, reason: "GCS 等インフラ障害"}

      - method: POST
        path: /internal/v1/players/:playerId/scenarios/:episodeId/complete
        summary: エピソードをクリア済みとしてマーク
        auth: ClusterIP（gateway 経由）
        response_type: ScenarioCompleteResponse
        response_example: '{"message": "episode completed", "episode_id": "ep_001"}'
        errors:
          - {status: 403, reason: "エピソードがロック中"}
          - {status: 404, reason: "エピソードが存在しない"}

  - name: オンボーディング (internal REST — gateway → scenario)
    description: >
      ゲーム開始時に一度だけ読むオンボーディングシナリオ。読了時に display_name と
      初期 faction を受け取り、account / card / gateway に Pub/Sub でイベントを配信する。
      完了は transactional outbox で保証される（詳細は ADR-021）。
    endpoints:
      - method: GET
        path: /internal/v1/players/:playerId/onboarding/status
        summary: オンボーディング完了状態を返す（クライアント起動時のオンボ画面表示判定）
        auth: ClusterIP（gateway 経由）
        response_type: OnboardingStatus
        response_example: '{"player_id": "uuid", "onboarded": false}'

      - method: GET
        path: /internal/v1/players/:playerId/onboarding/script
        summary: オンボーディングシナリオ本文を取得（GCS からロード）
        auth: ClusterIP（gateway 経由）
        query_params:
          - {name: lang, type: string, default: "ja", description: "スクリプト言語 (ja / en)"}
        response_type: OnboardingScriptResponse
        response_example: '{"script": "..."}'
        errors:
          - {status: 404, reason: "要求言語のスクリプトが存在しない"}
          - {status: 409, reason: "既にオンボーディング完了済み"}
          - {status: 500, reason: "GCS 等インフラ障害"}

      - method: POST
        path: /internal/v1/players/:playerId/onboarding/complete
        summary: オンボーディング完了を記録し player-onboarded / faction-selected を発行
        auth: ClusterIP（gateway 経由）
        request_type: OnboardingCompleteRequest
        response_type: OnboardingCompleteResponse
        response_example: '{"message": "onboarding completed", "player_id": "uuid"}'
        errors:
          - {status: 400, reason: "display_name / initial_faction_id の検証失敗"}
          - {status: 409, reason: "既にオンボーディング完了済み"}
          - {status: 500, reason: "DB / outbox 書き込み失敗"}
